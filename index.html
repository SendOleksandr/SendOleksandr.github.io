<!DOCTYPE HTML>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <title>Raketa Push + Subscribe</title>

  <!-- SendPulse Web Push Script -->
  <script charset="UTF-8" src="//pre.sendpulse.com/js/push/df63dc29012c15d0262d009e0a652416_1.js" async></script>

  <!-- SendPulse Form Loader -->
  <script async src="//web.webformscr.com/apps/fc3/build/loader.js"
          sp-form-id="049cba051e24322c8d99551e6afa1ef3c848d63f9b834d1c2cc05d67488245d1">
  </script>

  <style>
    body { font-family: Arial, sans-serif; text-align: center; margin-top: 60px; }
    .input-field {
      display: block;
      margin: 10px auto;
      padding: 8px;
      width: 250px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    button {
      background-color: #0089bf;
      color: white;
      border: none;
      border-radius: 5px;
      padding: 10px 20px;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover { background-color: #006d99; }
  </style>
</head>

<body>
  <h1>Raketa</h1>
  <p>Subscribe to our updates and notifications!</p>

  <!-- Custom form fields -->
  <input class="sp_push_custom_data input-field" type="text" name="name" placeholder="Name">
  <input class="sp_push_custom_data input-field" type="email" name="email" placeholder="Email">
  <input class="sp_push_custom_data input-field" type="phone" name="phone" placeholder="Phone">

  <!-- Subscribe button -->
  <button id="subscribeBtn">Subscribe</button>

  <script>
  // Wait until everything is loaded
  document.addEventListener('DOMContentLoaded', function() {
    const subscribeBtn = document.getElementById('subscribeBtn');

    subscribeBtn.addEventListener('click', function() {
      // 1️⃣ Trigger SendPulse Web Push permission prompt
      if (typeof spPush === 'object' && spPush.showPrompt) {
        spPush.showPrompt();
      } else {
        console.warn('SendPulse Push script not loaded or domain not matched.');
      }

      // 2️⃣ Trigger the SendPulse Form submission (if visible)
      const sendpulseForm = document.querySelector('.sp-form form');
      if (sendpulseForm) {
        const formButton = sendpulseForm.querySelector('button.sp-button');
        if (formButton) formButton.click();
      }
    });
  });
  </script>
</body>
</html>
